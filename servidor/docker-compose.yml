# Sobe a API que o Coruja GPS consome.
#
#   docker compose up -d
#   curl -i http://localhost:8081/radares.versao
#
# Publique a base copiando o radares.bin para ./dados/ — o pipeline que gera
# o arquivo não é assunto deste serviço, e é por isso que ele pode viver no
# repositório público.

services:
  coruja-api:
    build: .
    image: coruja-gps/api:1.0
    container_name: coruja-api
    restart: unless-stopped

    ports:
      # Exposto na rede local, para que o Pico alcance o serviço pelo Wi-Fi.
      #
      # ⚠️ Isto é HTTP PURO. Qualquer um na mesma rede pode substituir a base
      # de radares que o aparelho vai baixar, e o aparelho confiaria nela. É
      # aceitável numa rede doméstica de confiança e para testes; NÃO é
      # aceitável em rede aberta nem exposto à internet.
      #
      # Para sair da rede local, ponha um proxy reverso com TLS na frente e
      # volte esta linha para "127.0.0.1:${CORUJA_PORTA_HOST:-8081}:8080".
      # Ver o README.
      #
      # A porta de FORA e variavel, e a de dentro nao. Porta publicada e
      # valor de implantacao: fixa-la aqui obrigava a editar este arquivo em
      # cada servidor -- e como ele vive no repositorio PUBLICO, incluido
      # como submodulo, isso deixava o submodulo sujo para sempre. Com a
      # variavel, cada maquina ajusta pelo ambiente ou por um `.env` ao lado,
      # sem tocar no versionado.
      - "${CORUJA_PORTA_HOST:-8081}:8080"

    volumes:
      # Somente leitura: o serviço nunca escreve AQUI. Se ele for
      # comprometido, não há como alterar a base que os aparelhos vão baixar.
      - ./dados:/dados:ro

      # O que os aparelhos mandam (log, viagens, infrações). Volume PRÓPRIO e
      # gravável — e é por isso que ele não é um subdiretório de `dados/`:
      # abrir o volume da base para escrita só porque a recepção precisa dela
      # jogaria fora a garantia de cima.
      #
      # Só tem efeito com `aparelhos.cfg` preenchido; sem lista a recepção
      # está desligada e nada chega aqui.
      - ./recebidos:/recebidos

      # Quem pode falar com o servidor: `nome=token`, uma por linha. Copie o
      # `aparelhos.cfg.exemplo` e troque os segredos.
      #
      # ⚠️ ENQUANTO ELE NÃO EXISTIR o compose não sobe — o Docker cria um
      # DIRETÓRIO no lugar do arquivo que falta. Crie-o antes:
      #
      #     cp aparelhos.cfg.exemplo aparelhos.cfg && $EDITOR aparelhos.cfg
      #
      # Para rodar sem recepção, comente esta linha: as rotas da base ficam
      # abertas e o envio responde 401.
      - ./aparelhos.cfg:/aparelhos.cfg:ro

    # Com que usuário o processo roda DENTRO do container.
    #
    # O padrão é o da imagem, sem privilégio. Mas os volumes vêm do host, e
    # quem os criou costuma ser outro uid: aí o serviço não lê o
    # `aparelhos.cfg` e — pior, porque só aparece no primeiro envio — não
    # escreve em `recebidos/`.
    #
    # Para casar, ponha o seu uid:gid num `.env` ao lado deste arquivo:
    #
    #     CORUJA_UID=1000:1000        # veja o seu com `id -u`:`id -g`
    #
    # A alternativa seria afrouxar a permissão dos arquivos no host, e um
    # deles guarda os segredos dos aparelhos.
    user: "${CORUJA_UID:-10001:10001}"

    environment:
      CORUJA_PORTA: "8080"
      CORUJA_ENDERECO: "0.0.0.0"
      CORUJA_RECEBIDOS: "/recebidos"
      CORUJA_APARELHOS: "/aparelhos.cfg"

    # Endurecimento barato: o processo não precisa de nada disso. O
    # `read_only` continua valendo — o volume de recebidos é a única exceção,
    # e é montado explicitamente.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
